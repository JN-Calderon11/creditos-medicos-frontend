<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1200">
  @for (toast of toastService.toasts(); track toast) {
  <div class="alert alert-dismissible shadow-sm fade show d-flex align-items-start gap-2 mb-2"
    [class]="alertClass(toast.type)" role="alert">
    <i class="bi fs-5" [class]="iconClass(toast.type)"></i>
    <div class="flex-grow-1">
      <strong class="d-block">{{ toast.title }}</strong>
      {{ toast.message }}
    </div>
    <button type="button" class="btn-close" aria-label="Cerrar" (click)="toastService.remove(toast)">
    </button>
  </div>
  }
</div>
