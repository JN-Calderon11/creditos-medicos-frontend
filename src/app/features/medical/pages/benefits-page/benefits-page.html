<div class="container py-4" style="--p:#0E5B53">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0 fw-bold">Beneficios</h2>
        <button type="button" class="btn fw-semibold rounded-3 px-3 text-white" style="background:var(--p)"
            (click)="openAdd()">
            + Agregar beneficio
        </button>
    </div>

    <app-benefit-list [benefits]="benefits()" (remove)="onRemove($event)" (edit)="openEdit($event)" />
</div>
