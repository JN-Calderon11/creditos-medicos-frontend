<div class="include">
  <div class="include__input">
    <span class="include__input-icon"><i class="fa-solid fa-plus"></i></span>
    <input type="text"
      [value]="includeText()"
      (input)="includeText.set($any($event.target).value)"
      (keydown.enter)="$event.preventDefault(); addInclude()"
      placeholder="Agregar beneficio (ej. Consultas ilimitadas)">
    <button type="button" class="include__add-btn" (click)="addInclude()" [disabled]="!includeText().trim()">
      <i class="fa-solid fa-plus"></i>
      <span>Agregar</span>
    </button>
  </div>

  @if (includes().length) {
    <ul class="include__list">
      @for (item of includes(); track item; let idx = $index) {
        <li class="include__item">
          <span class="include__item-check">
            <i class="fa-solid fa-check"></i>
          </span>
          <span class="include__item-text">{{ item }}</span>
          <button type="button" class="include__item-remove" (click)="removeInclude(idx)" aria-label="Quitar">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="include__empty">Aún no hay beneficios agregados</p>
  }
</div>
