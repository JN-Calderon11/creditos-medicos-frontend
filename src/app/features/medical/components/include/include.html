<div class="mb-3">
    <label class="form-label fw-semibold">Includes</label>
    <div class="input-group mb-2">
        <input type="text" [value]="includeText()" (input)="includeText.set($any($event.target).value)"
            class="form-control rounded-start-3" placeholder="Agregar punto">
        <button type="button" class="btn text-white fw-semibold" style="background:#0E5B53"
            (click)="addInclude()">+</button>
    </div>
    <ul class="list-group">
        @for (item of includes(); track item; let idx = $index) {
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ item }}
            <button type="button" class="btn btn-sm btn-outline-danger rounded-3"
                (click)="removeInclude(idx)">x</button>
        </li>
        }
    </ul>
</div>
